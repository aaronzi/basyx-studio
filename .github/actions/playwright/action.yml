name: Install the Playwright browser
description: Chromium for the installed Playwright version, cached per version, with its system dependencies. Needs the installed dependencies.

runs:
  using: composite
  steps:
    - name: Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "${GITHUB_OUTPUT}"

    - name: Restore Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

    # Downloads Chromium only on a cache miss; the system packages are always installed.
    - name: Install Playwright browser
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
