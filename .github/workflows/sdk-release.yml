name: SDK Release

# A tag sdk-v<version> publishes @basyx/studio-sdk, @basyx/studio-app-kit and
# @basyx/file-viewer at that version to npm (ADR 0043, ADR 0052). The
# packages are versioned together, independently of Studio; the SDK's README
# maps each version to its app API. Publishing uses npm trusted publishing:
# each package's trusted publisher on npmjs.com names this repository and
# this workflow file, so no token is stored. Every version carries a
# provenance statement.

on:
  push:
    tags: ["sdk-v*"]

concurrency:
  group: sdk-release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: Check the packages
    if: ${{ github.repository == 'eclipse-basyx/basyx-studio' && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag names the version of all three packages, and the SDK's
      # README says which app API it provides.
      - name: Versions match the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#sdk-v}"
          for package in studio-sdk studio-app-kit file-viewer; do
            actual="$(node -p "require('./packages/${package}/package.json').version")"
            if [[ "${actual}" != "${version}" ]]; then
              echo "packages/${package} is at ${actual}; the tag names ${version}." >&2
              exit 1
            fi
          done
          if ! grep -q "^| ${version} |" packages/studio-sdk/README.md; then
            echo "The version table of packages/studio-sdk/README.md has no row for ${version}." >&2
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # The starter example, installed from the packed packages outside the
      # checkout: builds, packs, signs, verifies and runs on the test
      # transport.
      - name: Build an app from the packed packages
        run: node scripts/check-app-tarballs.mjs

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing and the provenance statement.
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable and verify pnpm
        run: bash .github/scripts/setup-pnpm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm --filter "./packages/*" run build

      # Recursive publishing goes in dependency order and skips versions that
      # are on npm already, so a re-run after a partial failure completes the
      # release. The tag checkout is a detached HEAD, hence no git checks.
      - name: Publish
        run: pnpm publish --recursive --filter "./packages/*" --access public --provenance --no-git-checks
