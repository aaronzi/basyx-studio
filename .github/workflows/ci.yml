name: CI

# Jobs run side by side; a pull request runs a job only when it changes one
# of the job's paths (scripts/ci-changes.mjs), and `CI result` sums up the
# run. Pushes to main, the nightly run and a manual run run every job.
# docs/development/ci.md describes the jobs and the rules.

on:
  pull_request:
    branches: [main]
    # Documentation alone needs no build, tests or scan.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Jobs of this run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      integration: ${{ steps.plan.outputs.integration }}
      e2e-web: ${{ steps.plan.outputs.e2e-web }}
      desktop-e2e: ${{ steps.plan.outputs.desktop-e2e }}
      containers: ${{ steps.plan.outputs.containers }}
      image: ${{ steps.plan.outputs.image }}
      packages: ${{ steps.plan.outputs.packages }}

    steps:
      # A pull request checks out its merge commit; with its parents, the
      # diff against the base branch is known.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Decide which jobs run
        id: plan
        run: node scripts/ci-changes.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  lint:
    name: Lint and translations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Translations
        run: pnpm i18n:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm test

  build:
    name: Build hosted Studio and the example apps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The build also proves the server bundle: inlined aas-core and the
      # traced PGlite WebAssembly assets (ADR 0011).
      - name: Build
        run: pnpm build

      # Installable packages of the example apps, used by the app tests (MVP-3).
      - name: Build example apps
        run: pnpm apps:build

      # One file, uploaded without zipping, for the end-to-end jobs.
      - name: Pack the build
        run: tar --zstd -cf studio-build.tar.zst .output examples/apps/dist

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: studio-build.tar.zst
          archive: false
          retention-days: 1

  packages:
    name: An app built from the packed packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/playwright

      # examples/apps/starter as a repository of its own (ADR 0043): the
      # @basyx/* packages are packed and installed from the tarballs outside
      # the checkout, so anything that still reaches into this repository
      # fails. The example's other dependencies come from the registry,
      # without a lockfile, as in a new repository.
      - name: Build, pack and run the starter from the packed packages
        run: node scripts/check-app-tarballs.mjs

  integration:
    name: Integration tests against the test environment
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start test environment
        run: bash .github/scripts/testenv.sh start

      - uses: ./.github/actions/setup

      - name: Wait for test environment
        run: bash .github/scripts/testenv.sh wait

      - name: Smoke test
        run: pnpm testenv:smoke

      - name: Integration tests
        run: pnpm test:integration

      - name: Dump test environment logs on failure
        if: failure()
        working-directory: test-setup
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300

      - name: Stop test environment
        if: always()
        working-directory: test-setup
        run: docker compose down -v

  containers:
    name: Local container lifecycle and export/import
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Real BaSyx stacks on the runner's Docker engine (ADR 0033).
      - name: Local container lifecycle and export/import
        run: pnpm exec vitest run test/integration/containers.test.ts
        env:
          STUDIO_CONTAINER_TESTS: "1"
          STUDIO_CONTAINER_COMPOSE_TESTS: "1"

  # Starts with the build, not after it: it prepares the test environment,
  # dependencies and browser meanwhile and then waits for the build artifact.
  e2e-web:
    name: End-to-end tests, hosted web (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.e2e-web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Shards of about the same duration (test/e2e/web.config.ts), each
        # against its own test environment; "other" takes every other file.
        shard: [apps, models3d, content, other]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start test environment
        run: bash .github/scripts/testenv.sh start

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/playwright

      - name: Wait for the build
        run: bash .github/scripts/wait-for-artifact.sh studio-build.tar.zst "Build hosted Studio and the example apps"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-build.tar.zst
          path: ${{ runner.temp }}/build

      - name: Unpack the build
        run: tar --zstd -xf "$(find "${RUNNER_TEMP}/build" -type f | head -n 1)"

      - name: Wait for test environment
        run: bash .github/scripts/testenv.sh wait

      - name: End-to-end tests (hosted web)
        run: pnpm test:e2e:web
        env:
          STUDIO_E2E_SHARD: ${{ matrix.shard }}

      # One origin per installation and a shared apps origin (ADR 0045), on
      # two Studios without login; embedded views read the open BaSyx.
      - name: End-to-end tests (app origins)
        if: matrix.shard == 'other'
        run: pnpm test:e2e:origins

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-web-${{ matrix.shard }}
          path: |
            playwright-report/web
            test-results/web
            playwright-report/origins
            test-results/origins
          retention-days: 7

      - name: Dump test environment logs on failure
        if: failure()
        working-directory: test-setup
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300

      - name: Stop test environment
        if: always()
        working-directory: test-setup
        run: docker compose down -v

  desktop-e2e:
    name: End-to-end tests of the packaged desktop app (Linux)
    needs: changes
    if: needs.changes.outputs.desktop-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A display, a Secret Service for Electron safeStorage (Studio refuses
      # plain-text key storage), and unprivileged user namespaces for the
      # Chromium sandbox, which Ubuntu restricts by default. The packages
      # install in the background during the build.
      - name: Prepare display, keyring and sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash .github/scripts/background.sh start packages "sudo apt-get update && sudo apt-get install -y xvfb gnome-keyring dbus-x11"

      - uses: ./.github/actions/setup

      - name: Build the unpacked desktop app
        run: pnpm build:electron:dir --linux --x64

      - name: Build example apps
        run: pnpm apps:build

      - name: Wait for display and keyring packages
        run: bash .github/scripts/background.sh wait packages

      - name: End-to-end tests (packaged desktop)
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            STUDIO_CONTAINER_E2E=1 xvfb-run --auto-servernum pnpm test:e2e:desktop
          '

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-desktop
          path: |
            playwright-report/desktop
            test-results/desktop
          retention-days: 7

  image:
    name: Container image build and smoke test
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One platform is enough to prove the image; the workflows that publish
      # build both (docker-snapshot.yml, docker-release.yml). No layer cache:
      # the source is copied before the install, so every build misses it,
      # and exporting it took a minute.
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: basyx-studio:ci
          build-args: |
            STUDIO_VERSION=ci-${{ github.sha }}
            STUDIO_COMMIT_SHA=${{ github.sha }}

      # Read-only root file system, uid 1000, base path, no login, a declared
      # infrastructure: health, pages, assets and the API.
      - name: Smoke test
        run: bash .github/scripts/image-smoke-test.sh basyx-studio:ci

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The time series example (InfluxDB 2.7, BaSyx Go, the influxdb2
      # connection and the bundled Time Series Data app, ADR 0040) and signed
      # apps (packages signed with cosign install without developer mode,
      # update in place and are revoked with their key, ADR 0044), side by
      # side on their own ports and Compose projects.
      - name: Deployment examples
        run: bash .github/scripts/deployment-examples.sh
        env:
          STUDIO_IMAGE: basyx-studio:ci

  ci-result:
    name: CI result
    # Also after failures, to report them; not for a run a newer push replaced.
    if: ${{ !cancelled() }}
    needs: [changes, lint, typecheck, unit, build, packages, integration, containers, e2e-web, desktop-e2e, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-changes.mjs
          sparse-checkout-cone-mode: false

      - name: Check that every planned job succeeded
        run: node scripts/ci-changes.mjs verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          PLAN: ${{ needs.changes.outputs.plan }}
