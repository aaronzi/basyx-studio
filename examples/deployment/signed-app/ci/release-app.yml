# A release workflow for an app in its own repository (ADR 0044): build,
# pack, sign with cosign and attach the package and its signature to the
# GitHub release. Copy it to .github/workflows/ of the app's repository.
#
# Secrets of that repository:
#   COSIGN_PRIVATE_KEY   the content of cosign.key (cosign generate-key-pair)
#   COSIGN_PASSWORD      its password
# cosign.pub is committed next to this workflow and given to the operators of
# the Studio deployments, who add it to their trust store.

name: Release app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  APP_ID: org.example.my-app

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pin actions to commit SHAs in a real repository.
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # studio-app.json and the files below dist/ (add `--include backend`
      # for a backend), checked as Studio's upload checks them, by
      # `studio-app pack` of @basyx/studio-app-kit (ADR 0043). The version in
      # studio-app.json must be higher than the installed one.
      - name: Pack
        run: |
          package="${APP_ID}-${GITHUB_REF_NAME#v}.zip"
          pnpm exec studio-app pack --out "${package}"
          echo "PACKAGE=${package}" >> "$GITHUB_ENV"

      # cosign 3: the signing flags below need it (installer v3 installs cosign 2).
      - uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.0.6

      # A detached signature over the exact package bytes. With a PEM key
      # instead of a cosign key, `pnpm exec studio-app sign "${PACKAGE}" --key
      # signing.pem` writes the same .sig without cosign. cosign 3 needs both
      # flags to sign offline with a key; with cosign 2, which has no
      # --use-signing-config, leave that flag out.
      # Without them, cosign 3 writes a Sigstore bundle (--bundle) and
      # records the signature in the public Rekor log; Studio reads such
      # bundles too.
      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: >-
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY
          --use-signing-config=false --tlog-upload=false
          --output-signature "${PACKAGE}.sig" "${PACKAGE}"

      - name: Verify
        run: cosign verify-blob --key cosign.pub --insecure-ignore-tlog=true --signature "${PACKAGE}.sig" "${PACKAGE}"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${PACKAGE}" "${PACKAGE}.sig" --verify-tag --generate-notes
